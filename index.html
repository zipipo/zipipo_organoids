<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organoid Culture Log</title>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
<style>
:root{--bg:#F8FAFC;--sur:#fff;--pri:#3B82F6;--psoft:#EFF6FF;--tx:#1E293B;--sub:#64748B;--bd:#E2E8F0;}
*{box-sizing:border-box;}
body{font-family:'Pretendard',sans-serif;background:var(--bg);color:var(--tx);margin:0;padding:15px;line-height:1.3;}
.wrap{max-width:1340px;margin:0 auto;}

/* HEADER */
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;flex-wrap:wrap;gap:8px;}
.hdr h1{font-size:1.18rem;font-weight:700;margin:0;color:#0F172A;}
.hdr-r{display:flex;gap:6px;flex-wrap:wrap;}

/* BUTTONS */
.btn{font-family:inherit;font-weight:600;cursor:pointer;border-radius:4px;padding:0 11px;border:none;
     transition:opacity .1s;font-size:.79rem;height:30px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;}
.btn:hover{opacity:.78;}
.btn-pri{background:var(--pri);color:#fff;}
.btn-out{background:#fff;border:1px solid var(--bd);color:var(--sub);}
.btn-edt{background:#F1F5F9;color:#475569;border:1px solid var(--bd);}
.btn-fin{background:#D1FAE5;color:#065F46;border:1px solid #A7F3D0;}
.btn-del{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA;}

/* STOCK BANNER */
#stockBanner{margin-bottom:10px;}
.sc-card{background:#FFF7ED;border:1px solid #FED7AA;border-radius:6px;padding:10px 14px;display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.sc-title{font-size:.79rem;font-weight:700;color:#9A3412;white-space:nowrap;padding-top:3px;}
.sc-item{display:flex;flex-direction:column;gap:3px;background:#fff;border:1px solid #FED7AA;border-radius:5px;padding:6px 10px;min-width:185px;}
.sc-lbl{font-size:.76rem;font-weight:700;color:#9A3412;}
.sc-sub{font-size:.72rem;color:#B45309;}
.sc-chk{display:flex;align-items:center;gap:5px;background:#fff;border:1px solid #FED7AA;border-radius:4px;
        padding:3px 8px;font-size:.75rem;cursor:pointer;transition:.1s;user-select:none;}
.sc-chk:hover{background:#FFF7ED;}
.sc-chk.done{background:#F1F5F9;border-color:#E2E8F0;color:#94A3B8;text-decoration:line-through;}
.sc-chk input{cursor:pointer;accent-color:#EA580C;}

/* ═══ DASHBOARD (well board) ═══ */
#dash{margin-bottom:12px;}
.dash-card{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:14px 16px;}
.dash-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
.dash-ttl{font-size:.82rem;font-weight:700;color:var(--tx);letter-spacing:.01em;}
.dash-totals{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
.dt-pill{display:inline-flex;align-items:baseline;gap:5px;}
.dt-pill .dt-num{font-size:1.15rem;font-weight:800;line-height:1;color:#0F172A;}
.dt-pill .dt-lbl{font-size:.72rem;font-weight:600;color:var(--sub);}
.dt-pill.warn .dt-num{color:#B45309;}
.dt-pill.warn .dt-lbl{color:#B45309;}
.dt-pill.due .dt-num{color:#B91C1C;}
.dt-pill.due .dt-lbl{color:#B91C1C;}

/* type sections */
.dash-types{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;}
.dtype{border:1px solid var(--bd);border-radius:7px;overflow:hidden;}
.dtype-hd{padding:7px 11px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:.8rem;}
.dtype-hd .dh-r{font-size:.74rem;font-weight:600;opacity:.85;}
.dtype-body{padding:4px 0;}
.dline{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:5px 11px;border-top:1px solid #F1F5F9;}
.dline:first-child{border-top:none;}
.dline-name{font-size:.78rem;font-weight:600;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.dline-pd{font-size:.71rem;color:var(--sub);font-weight:500;}
.dline-well{font-size:.76rem;font-weight:700;color:#166534;white-space:nowrap;}
.mc-tag{font-size:.69rem;padding:2px 7px;border-radius:10px;font-weight:700;white-space:nowrap;text-align:center;min-width:46px;}
.mc-ok{background:#DCFCE7;color:#15803D;}
.mc-warn{background:#FEF3C7;color:#B45309;}
.mc-due{background:#FEE2E2;color:#B91C1C;}

/* ENTRY CARD */
.card{background:var(--sur);border-radius:6px;border:1px solid var(--bd);margin-bottom:11px;box-shadow:0 1px 2px rgba(0,0,0,.02);}
.card-hd{padding:9px 12px;border-bottom:1px solid var(--bd);font-weight:700;background:#F8FAFC;font-size:.87rem;}
.eform{padding:12px;background:var(--psoft);display:flex;flex-direction:column;gap:9px;}
.frow{display:grid;gap:9px;align-items:end;}
.r1{grid-template-columns:1.6fr 1.6fr 1fr;}
.r2{grid-template-columns:1fr .75fr .75fr 1.9fr 64px;}
label{display:block;font-size:.72rem;color:#475569;margin-bottom:3px;font-weight:600;}
input,select,textarea{width:100%;padding:4px 8px;border:1px solid #CBD5E1;border-radius:4px;font-family:inherit;font-size:.83rem;}
input,select{height:31px;}
textarea{resize:vertical;min-height:31px;line-height:1.45;}
.dgrp{display:flex;gap:5px;align-items:center;}
.dgrp input{flex:1;}
#bulkTags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.dtag{background:#E2E8F0;padding:2px 7px;border-radius:4px;font-size:.72rem;display:flex;align-items:center;gap:4px;}
.dtx{cursor:pointer;color:#64748B;font-weight:700;}.dtx:hover{color:#DC2626;}
.prev-bar{padding:7px 12px;font-size:.82rem;color:var(--pri);font-weight:600;background:#fff;min-height:31px;border-bottom:1px solid var(--bd);}

/* STOCK INLINE */
#stockInline{display:none;background:#FFF7ED;border:1px solid #FED7AA;border-radius:4px;padding:7px 10px;}
#stockInline>label{color:#9A3412;margin-bottom:5px;}
.si-row{display:flex;gap:14px;flex-wrap:wrap;}
.si-row label{font-size:.75rem;display:flex;align-items:center;gap:4px;color:#475569;font-weight:500;cursor:pointer;margin:0;}
.si-row input{width:auto;height:auto;}

/* SECTION TITLES */
.sec{font-size:.95rem;font-weight:700;margin:18px 0 7px;}
.sec.dim{color:var(--sub);}
.arch-row{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;}
.arch-arr{font-size:.82rem;transition:transform .2s;display:inline-block;}
.arch-open .arch-arr{transform:rotate(90deg);}
#archCount{font-size:.77rem;font-weight:500;color:#94A3B8;}

/* TIMELINE */
.tl-wrap{margin-bottom:9px;border:1px solid var(--bd);border-radius:5px;overflow:hidden;}
.tl-hdr{padding:8px 12px;font-weight:700;font-size:.83rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;}
.tl-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.tl-body{overflow:hidden;transition:max-height .25s ease;}
.tl-body.col{max-height:0!important;}

/* TABLE */
table{width:100%;border-collapse:collapse;text-align:left;background:#fff;table-layout:fixed;}
th{padding:6px 8px;background:#F8FAFC;color:var(--sub);font-size:.71rem;border-bottom:1px solid var(--bd);}
td{padding:6px 8px;border-bottom:1px solid var(--bd);font-size:.78rem;vertical-align:top;word-break:break-word;}
.mcell{white-space:pre-line;}

/* BADGES */
.badge{padding:2px 6px;border-radius:4px;font-size:.7rem;font-weight:600;display:inline-block;white-space:nowrap;border:1px solid transparent;}
.bm{background:#E0F2FE;color:#0284C7;border-color:#BAE6FD;}
.bsp{background:#FFEDD5;color:#C2410C;border-color:#FED7AA;}
.br{background:#D1FAE5;color:#059669;border-color:#A7F3D0;}
.bpl{background:#F3E8FF;color:#7E22CE;border-color:#E9D5FF;}
.bst{background:#FCE7F3;color:#BE185D;border-color:#FBCFE8;}
.bf{background:#F1F5F9;color:#475569;border-color:#CBD5E1;}
.bo{background:#FEF9C3;color:#A16207;border-color:#FEF08A;}
.bsd{background:#CCFBF1;color:#0F766E;border-color:#99F6E4;}

.pb{padding:2px 6px;border-radius:4px;font-weight:700;font-size:.77rem;display:inline-block;border:1px solid transparent;}
.p0{background:#F1F5F9;color:#475569;border-color:#E2E8F0;}
.p1{background:#E0F2FE;color:#0284C7;border-color:#BAE6FD;}
.p2{background:#D1FAE5;color:#059669;border-color:#A7F3D0;}
.p3{background:#FEF3C7;color:#D97706;border-color:#FDE68A;}
.p4{background:#EDE9FE;color:#7C3AED;border-color:#DDD6FE;}
.p5{background:#FCE7F3;color:#DB2777;border-color:#FBCFE8;}
.p6{background:#E0E7FF;color:#4F46E5;border-color:#C7D2FE;}
.p7{background:#CCFBF1;color:#0D9488;border-color:#99F6E4;}
.p8{background:#FEE2E2;color:#DC2626;border-color:#FECACA;}
.p9{background:#FFEDD5;color:#EA580C;border-color:#FED7AA;}
.ph{background:#1E293B;color:#F8FAFC;border-color:#0F172A;}

/* MODAL */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);justify-content:center;
       align-items:flex-start;z-index:300;padding:20px;overflow-y:auto;}
.modal.open{display:flex;}
.mbox{background:#fff;padding:20px;border-radius:6px;width:600px;max-width:100%;
      box-shadow:0 12px 30px rgba(0,0,0,.15);margin:auto;display:flex;flex-direction:column;max-height:calc(100vh - 40px);}
.mscroll{overflow-y:auto;flex:1;padding-right:2px;}
.mbox h2{margin:0 0 13px;font-size:1.02rem;border-bottom:1px solid #E2E8F0;padding-bottom:9px;flex-shrink:0;}
.mfoot{padding-top:11px;border-top:1px solid var(--bd);flex-shrink:0;margin-top:12px;}
.tbl-btn{background:#F8FAFC;border:1px solid #E2E8F0;color:#475569;border-radius:4px;cursor:pointer;font-size:.7rem;padding:3px 6px;font-weight:600;transition:.1s;}
.tbl-btn:hover{background:#E2E8F0;}
</style>
</head>
<body>
<div class="wrap">

<!-- HEADER -->
<div class="hdr">
  <h1>Organoid Culture Log</h1>
  <div class="hdr-r">
    <input type="file" id="csvFile" style="display:none;" accept=".csv" onchange="importCSV(event)">
    <button class="btn btn-out" onclick="cleanBroken()" style="color:#B91C1C;border-color:#FECACA;">깨진 라인 정리</button>
    <button class="btn btn-out" onclick="document.getElementById('csvFile').click()">CSV 복원</button>
    <button class="btn btn-out" onclick="openLineModal()">Cell Line 관리</button>
    <button class="btn btn-out" onclick="exportCSV()">CSV 저장</button>
  </div>
</div>

<!-- STOCK BANNER -->
<div id="stockBanner"></div>

<!-- DASHBOARD -->
<div id="dash"></div>

<!-- ENTRY CARD -->
<div class="card">
  <div class="card-hd">데일리 작업 기록</div>
  <div class="eform">
    <div class="frow r1">
      <div>
        <label>작업 날짜 (다중 추가 가능)</label>
        <div class="dgrp">
          <input type="date" id="logDate">
          <button class="btn btn-out" onclick="addBulkDate()">날짜 추가</button>
        </div>
        <div id="bulkTags"></div>
      </div>
      <div><label>라인 선택</label><select id="lineSelect" onchange="previewDay()"></select></div>
      <div><label>수행 액션</label>
        <select id="logAction" onchange="onActChange()">
          <option value="Media Change">Media Change</option>
          <option value="Split">Split (P+1, d0)</option>
          <option value="Reseeding">Reseeding (d 누적)</option>
          <option value="Pellet 제작">Pellet 제작</option>
          <option value="Stock 제작">Stock 제작</option>
          <option value="Observation">Observation</option>
        </select>
      </div>
    </div>
    <div class="frow r2">
      <div><label>과정/Ratio</label><input type="text" id="logDet" placeholder="1:4 등"></div>
      <div><label>최종 Well</label><input type="number" id="logWells" min="0"></div>
      <div><label>Stock (vial)</label><input type="number" id="logStocks" min="0"></div>
      <div><label>메모 (엔터=줄바꿈)</label><textarea id="logMemo" rows="1" placeholder="특이사항"></textarea></div>
      <button class="btn btn-pri" onclick="saveDailyLog()">기록</button>
    </div>
    <div id="stockInline">
      <label>Stock 후처리 예정 항목 (기록 후 배너에 표시)</label>
      <div class="si-row">
        <label><input type="checkbox" id="chkLN2"> LN2 tank 이동 (다음날)</label>
        <label><input type="checkbox" id="chkDB"> DB 업데이트</label>
      </div>
    </div>
  </div>
  <div class="prev-bar" id="prevArea">라인을 선택하면 P/D 상태가 미리 계산됩니다.</div>
</div>

<!-- ACTIVE TIMELINES -->
<div class="sec">진행 중인 배양 타임라인</div>
<div id="activeTL"></div>

<!-- ARCHIVE -->
<div class="sec dim">
  <div class="arch-row" id="archRow" onclick="toggleArch()">
    <span class="arch-arr" id="archArr">&#9654;</span>
    <span>완료된 기록 (Archive)</span>
    <span id="archCount"></span>
  </div>
</div>
<div id="doneTL" style="display:none;"></div>

</div>

<!-- ═══ CELL LINE MODAL ═══ -->
<div id="lineModal" class="modal">
  <div class="mbox">
    <h2>Cell Line 관리</h2>
    <div class="mscroll">
      <div style="background:#F8FAFC;padding:13px;border-radius:6px;border:1px solid #E2E8F0;margin-bottom:13px;">
        <input type="hidden" id="elId">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px;">
          <div><label>환자 번호 / 라인명</label><input type="text" id="elPid" placeholder="HCC26 (2nd, Big)"></div>
          <div><label>종류 (직접 입력)</label><input type="text" id="elType" placeholder="PHH-org, Tumor-org 등"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:9px;">
          <div><label>시작 P</label><input type="number" id="elP" value="0" min="0"></div>
          <div><label>누적 d (base)</label><input type="number" id="elBase" value="0" min="0"></div>
          <div><label>초기 Well</label><input type="number" id="elWells" value="0" min="0"></div>
        </div>
        <div><label style="color:#D97706;">기준 날짜 (최초 seeding일)</label><input type="date" id="elStart"></div>
        <div style="display:flex;gap:7px;margin-top:13px;">
          <button class="btn btn-pri" style="flex:1;" onclick="saveLine()">저장 / 수정</button>
          <button class="btn btn-out" onclick="resetLineForm()">취소</button>
        </div>
      </div>
      <div id="lineList"></div>
    </div>
    <div class="mfoot">
      <button class="btn btn-out" style="width:100%;" onclick="closeLineModal()">닫기</button>
    </div>
  </div>
</div>

<!-- ═══ LOG EDIT MODAL ═══ -->
<div id="logModal" class="modal">
  <div class="mbox" style="width:560px;">
    <h2>기록 수정</h2>
    <div class="mscroll">
      <input type="hidden" id="eid">
      <div style="background:#F8FAFC;padding:13px;border-radius:6px;border:1px solid #E2E8F0;display:grid;gap:10px;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;">
          <div><label>날짜</label><input type="date" id="eDate"></div>
          <div><label>액션</label>
            <select id="eAct">
              <option>Seeded</option><option>Media Change</option><option>Split</option>
              <option>Reseeding</option><option>Pellet 제작</option><option>Stock 제작</option>
              <option>Observation</option><option>Finish (완료)</option>
            </select>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;">
          <div><label style="color:#7C3AED;">P (수동수정)</label><input type="number" id="eP" min="0"></div>
          <div><label style="color:#7C3AED;">D (수동수정)</label><input type="text" id="eD" placeholder="d5 또는 d10+3"></div>
        </div>
        <div style="background:#EFF6FF;border:1px solid #BAE6FD;border-radius:4px;padding:7px 10px;font-size:.76rem;color:#1D4ED8;line-height:1.5;">
          액션을 Split/Reseeding으로 바꾸면 <strong>이 로그 이후 모든 기록</strong>의 P/D가 자동 재계산됩니다.
        </div>
        <div style="height:1px;background:#E2E8F0;"></div>
        <div><label>과정/Ratio</label><input type="text" id="eDet"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;">
          <div><label>최종 Well</label><input type="number" id="eWells"></div>
          <div><label>Stock 수 (vial)</label><input type="number" id="eStocks"></div>
        </div>
        <div><label>메모</label><textarea id="eMemo" rows="3"></textarea></div>
      </div>
    </div>
    <div class="mfoot" style="display:flex;gap:7px;">
      <button class="btn btn-pri" style="flex:2;" onclick="updateLog()">수정 완료 + 재계산</button>
      <button class="btn btn-del" style="flex:1;" onclick="deleteLog()">삭제</button>
      <button class="btn btn-out" style="flex:1;" onclick="closeLogModal()">취소</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════
//  DATA
// ══════════════════════════════════════════
let lines       = JSON.parse(localStorage.getItem('orgLinesV2'))   || [];
let logs        = JSON.parse(localStorage.getItem('orgLogsV2'))    || [];
let stockChecks = JSON.parse(localStorage.getItem('orgStockChks')) || [];
let archOpen    = false;

document.getElementById('logDate').valueAsDate = new Date();
document.getElementById('elStart').valueAsDate = new Date();

// ══════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════
const parseP = s => (s===null||s===undefined)?0:(parseInt(String(s).replace(/[^0-9]/g,''))||0);

function parseD(str){
  if(!str||str==='END'||str==='-') return null;
  const s=String(str).replace(/^d/i,'');
  if(s.includes('+')){const[a,b]=s.split('+');return{base:parseInt(a)||0,diff:parseInt(b)||0};}
  return{base:0,diff:parseInt(s)||0};
}

function calcDayStr(line,targetDate){
  if(line.isCompleted&&line.finishDate) return line.finishDayStr||'END';
  const start=new Date(line.startDate),tgt=targetDate?new Date(targetDate):new Date();
  start.setHours(0,0,0,0);tgt.setHours(0,0,0,0);
  const diff=Math.floor((tgt-start)/86400000);
  return line.baseDay>0?`d${line.baseDay}+${diff}`:`d${diff}`;
}

const pCls = n=>{const v=parseP(n);return v<=9?'p'+v:'ph';};

function badgeCls(a){
  if(!a) return 'bo';
  const l=a.toLowerCase();
  if(l==='seeded') return 'bsd';
  if(l.includes('media')) return 'bm';
  if(l.includes('split')) return 'bsp';
  if(l.includes('reseed')) return 'br';
  if(l.includes('pellet')) return 'bpl';
  if(l.includes('stock')) return 'bst';
  if(l.includes('finish')||l.includes('완료')) return 'bf';
  return 'bo';
}

const isFin = a=>!!(a&&(a.includes('Finish')||a.includes('완료')));
const isSeed= a=>!!(a&&(a==='Seeded'||a==='Initial Seeding'));

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
const uid   = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const today = ()=>new Date().toISOString().split('T')[0];
const isoD  = s =>new Date(s).toISOString();

// ══════════════════════════════════════════
//  COLOR MAP
// ══════════════════════════════════════════
const PAL=[
  {bg:'#E0F2FE',tx:'#0369A1',bd:'#BAE6FD',hbg:'#DBEAFE',ht:'#1D4ED8'},
  {bg:'#FFEDD5',tx:'#9A3412',bd:'#FED7AA',hbg:'#FED7AA',ht:'#7C2D12'},
  {bg:'#F3E8FF',tx:'#6B21A8',bd:'#E9D5FF',hbg:'#EDE9FE',ht:'#5B21B6'},
  {bg:'#D1FAE5',tx:'#065F46',bd:'#A7F3D0',hbg:'#CCFBF1',ht:'#134E4A'},
  {bg:'#FCE7F3',tx:'#9D174D',bd:'#FBCFE8',hbg:'#FCE7F3',ht:'#831843'},
  {bg:'#FEF3C7',tx:'#78350F',bd:'#FDE68A',hbg:'#FEF9C3',ht:'#713F12'},
  {bg:'#E0E7FF',tx:'#3730A3',bd:'#C7D2FE',hbg:'#E0E7FF',ht:'#312E81'},
  {bg:'#CCFBF1',tx:'#134E4A',bd:'#99F6E4',hbg:'#CCFBF1',ht:'#0F766E'},
];
const DONE={bg:'#F1F5F9',tx:'#475569',bd:'#E2E8F0',hbg:'#F1F5F9',ht:'#475569'};
let tcm={};
function rebuildColors(){tcm={};let i=0;lines.forEach(l=>{if(!(l.type in tcm)){tcm[l.type]=PAL[i%PAL.length];i++;}});}
const getC=(type,done)=>done?DONE:(tcm[type]||PAL[0]);

// ══════════════════════════════════════════
//  MC DAYS (days since last MC or Split)
//  returns {days, cls} or null
// ══════════════════════════════════════════
function mcDays(line){
  if(line.isCompleted) return null;
  const rel=logs.filter(l=>l.lineId===line.id&&(l.action==='Media Change'||(l.action||'').includes('Split')))
    .sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!rel.length) return null;
  const last=new Date(rel[0].date),now=new Date();
  now.setHours(0,0,0,0);last.setHours(0,0,0,0);
  const d=Math.floor((now-last)/86400000);
  const cls=d<=2?'mc-ok':d===3?'mc-warn':'mc-due';
  return{days:d,cls};
}

// ══════════════════════════════════════════
//  LATEST WELL
// ══════════════════════════════════════════
function latestWell(line){
  const w=logs.filter(l=>l.lineId===line.id&&l.finalWells!==''&&l.finalWells!=null)
    .sort((a,b)=>new Date(b.date)-new Date(a.date));
  return w.length?w[0].finalWells:(line.initialWells||'');
}

// ══════════════════════════════════════════
//  DASHBOARD (well board + MC summary)
// ══════════════════════════════════════════
function renderDash(){
  const el=document.getElementById('dash');
  const active=lines.filter(l=>!l.isCompleted);
  if(!active.length){el.innerHTML='';return;}

  const groups={};
  let totalLines=active.length, totalWells=0;
  let mcWarn=0, mcDue=0;   // count of lines needing attention

  active.forEach(l=>{
    if(!groups[l.type]) groups[l.type]={count:0,wells:0,lines:[]};
    groups[l.type].count++;
    const w=parseInt(latestWell(l))||0;
    groups[l.type].wells+=w; totalWells+=w;
    const mc=mcDays(l);
    if(mc){ if(mc.cls==='mc-warn') mcWarn++; if(mc.cls==='mc-due') mcDue++; }
    groups[l.type].lines.push({label:l.patientId,well:w,p:l.passage,day:calcDayStr(l),mc});
  });

  // top totals — line count only (no total wells)
  let totals=`<div class="dt-pill"><span class="dt-num">${totalLines}</span><span class="dt-lbl">배양 라인</span></div>`;
  if(mcWarn>0) totals+=`<div class="dt-pill warn"><span class="dt-num">${mcWarn}</span><span class="dt-lbl">MC 3일차</span></div>`;
  if(mcDue>0)  totals+=`<div class="dt-pill due"><span class="dt-num">${mcDue}</span><span class="dt-lbl">MC 지연(4일+)</span></div>`;

  // type cards
  let typeCards='';
  Object.entries(groups).forEach(([type,d])=>{
    const c=getC(type,false);
    const dlines=d.lines.map(ll=>{
      const mcTag = ll.mc ? `<span class="mc-tag ${ll.mc.cls}">MC+${ll.mc.days}d</span>` : `<span class="mc-tag mc-ok" style="opacity:.4;">-</span>`;
      return `<div class="dline">
        <div class="dline-name">${esc(ll.label)} <span class="dline-pd">P${ll.p} / ${ll.day}</span></div>
        <div class="dline-well">${ll.well} well</div>
        ${mcTag}
      </div>`;
    }).join('');
    typeCards+=`<div class="dtype">
      <div class="dtype-hd" style="background:${c.hbg};color:${c.ht};">
        <span>${esc(type)}</span>
        <span class="dh-r">${d.count}라인 · ${d.wells} well</span>
      </div>
      <div class="dtype-body">${dlines}</div>
    </div>`;
  });

  el.innerHTML=`<div class="dash-card">
    <div class="dash-top">
      <div class="dash-ttl">현재 배양 현황</div>
      <div class="dash-totals">${totals}</div>
    </div>
    <div class="dash-types">${typeCards}</div>
  </div>`;
}

function toggleTL(id){
  const el=document.getElementById(id);if(!el) return;
  if(el.classList.contains('col')){
    el.classList.remove('col');el.style.maxHeight=el.scrollHeight+'px';
    el.addEventListener('transitionend',()=>{if(!el.classList.contains('col'))el.style.maxHeight='9999px';},{once:true});
  } else {
    el.style.maxHeight=el.scrollHeight+'px';
    requestAnimationFrame(()=>{el.classList.add('col');el.style.maxHeight='0px';});
  }
}

function saveDailyLog(){
  const lineId=document.getElementById('lineSelect').value;
  const action=document.getElementById('logAction').value;
  const det   =document.getElementById('logDet').value.trim();
  const wells =document.getElementById('logWells').value;
  const stocks=document.getElementById('logStocks').value;
  const memo  =document.getElementById('logMemo').value;
  const dates =bulkDates.length>0?[...bulkDates]:[document.getElementById('logDate').value];
  if(!lineId||!dates.length) return alert('라인과 날짜를 확인하세요.');

  dates.sort().forEach(date=>{
    const line=lines.find(l=>l.id===lineId);
    logs.push({id:uid(),lineId,date,action,passage:line.passage,dayInfo:calcDayStr(line,date),details:det,finalWells:wells,stocks,memo});
    if(action.includes('Split')){
      line.baseDay=0;
      line.isReseeded=false;
      line.startDate=isoD(date);
} else if(action==='Reseeding'){
      const s=new Date(line.startDate),ld=new Date(date);
      s.setHours(0,0,0,0);ld.setHours(0,0,0,0);
      line.baseDay+=Math.floor((ld-s)/86400000);
      line.isReseeded=true;line.startDate=isoD(date);
    }
    if(action==='Stock 제작'&&stocks&&parseInt(stocks)>0){
      const ln=lines.find(l=>l.id===lineId);
      stockChecks.push({id:uid(),lineLabel:`${ln.patientId}_${ln.type}`,date,stocks,ln2Done:false,dbDone:false});
    }
  });

  bulkDates=[];renderBulkTags();
  ['logDet','logWells','logStocks','logMemo'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('chkLN2').checked=false;
  document.getElementById('chkDB').checked=false;
  document.getElementById('stockInline').style.display='none';
  document.getElementById('logAction').value='Media Change';
  updateUI();previewDay();
}

// ══════════════════════════════════════════
//  RECALC LOGS FOR LINE
// ══════════════════════════════════════════
function recalcLogsForLine(lineId){
    return;
}

  // Determine starting state
  let curP,curBase,resd,curStart;
  const seedLog=lls.find(l=>isSeed(l.action));
  if(seedLog){
    curP=parseP(seedLog.passage);curBase=0;resd=false;
    curStart=new Date(seedLog.date);curStart.setHours(0,0,0,0);
    seedLog.dayInfo='d0';
  } else if(lls.length){
    // no Seeded log (e.g. imported) — anchor to the EARLIEST log:
    // use its passage as the starting P, and derive base/start from its dayInfo
    const first=lls.find(l=>!isFin(l.action))||lls[0];
    curP=parseP(first.passage);
    const di=parseD(first.dayInfo);
    if(di){
      curBase=di.base; resd=di.base>0;
      curStart=new Date(first.date);curStart.setHours(0,0,0,0);
      curStart.setDate(curStart.getDate()-di.diff);
    } else {
      curBase=0;resd=false;
      curStart=new Date(first.date);curStart.setHours(0,0,0,0);
    }
  } else {
    curP=line.passage;curBase=line.baseDay;resd=line.isReseeded;
    curStart=new Date(line.startDate);curStart.setHours(0,0,0,0);
  }

  lls.forEach(lg=>{
    if(isSeed(lg.action)) return;
    if(isFin(lg.action)){lg.passage=curP;lg.dayInfo='END';return;}
    const dt=new Date(lg.date);dt.setHours(0,0,0,0);
    const diff=Math.floor((dt-curStart)/86400000);
    lg.passage=curP;
    lg.dayInfo=(curBase>0||resd)?`d${curBase}+${diff}`:`d${diff}`;
    if((lg.action||'').includes('Split')){
      curP++;curBase=0;resd=false;curStart=new Date(lg.date);curStart.setHours(0,0,0,0);
    } else if(lg.action==='Reseeding'){
      curBase+=diff;resd=true;curStart=new Date(lg.date);curStart.setHours(0,0,0,0);
    }
  });

  // update line state to reflect "now" (latest)
  if(!line.isCompleted){
    line.passage=curP;line.baseDay=curBase;line.isReseeded=resd;
    line.startDate=curStart.toISOString();
  }
}

// ══════════════════════════════════════════
//  SAVE LINE
// ══════════════════════════════════════════
function saveLine(){
  const id   =document.getElementById('elId').value;
  const pId  =document.getElementById('elPid').value.trim();
  const type =document.getElementById('elType').value.trim();
  const p    =parseInt(document.getElementById('elP').value)||0;
  const baseD=parseInt(document.getElementById('elBase').value)||0;
  const wells=document.getElementById('elWells').value;
  const start=document.getElementById('elStart').value;
  if(!pId||!type||!start) return alert('필수 정보를 입력하세요.');

  if(id){
    const idx=lines.findIndex(l=>l.id===id);
    lines[idx]={...lines[idx],patientId:pId,type,passage:p,baseDay:baseD,
      isReseeded:(baseD>0),startDate:isoD(start),initialWells:wells};
    // update seed log to match
    const seed=logs.find(l=>l.lineId===id&&isSeed(l.action));
    if(seed){seed.date=start;seed.passage=p;seed.finalWells=wells;}
  } else {
    const nl={id:uid(),patientId:pId,type,passage:p,baseDay:baseD,
      isReseeded:(baseD>0),startDate:isoD(start),initialWells:wells,isCompleted:false};
    lines.push(nl);
    if(wells&&parseInt(wells)>0){
      logs.push({id:uid()+'_sd',lineId:nl.id,date:start,action:'Seeded',
        passage:p,dayInfo:baseD>0?`d${baseD}+0`:'d0',details:'',finalWells:wells,stocks:'',memo:'최초 seeding'});
    }
  }
  resetLineForm();updateUI();
}

function completeLine(id){
  const m=prompt('완료 처리하시겠습니까? 메모:');if(m===null) return;
  const line=lines.find(l=>l.id===id);
  const t=today(),ds=calcDayStr(line,t);
  line.isCompleted=true;line.finishDate=t;line.finishDayStr=ds;
  logs.push({id:uid(),lineId:id,date:t,action:'Finish (완료)',passage:line.passage,
    dayInfo:ds,details:'',finalWells:'',stocks:'',memo:m||'실험 종료'});
  updateUI();
}

  lines=lines.filter(l=>l.id!==id);logs=logs.filter(l=>l.lineId!==id);updateUI();

  closeLogModal();updateUI();
}

function closeLineModal(){document.getElementById('lineModal').classList.remove('open');resetLineForm();}
function closeLogModal(){document.getElementById('logModal').classList.remove('open');}
function resetLineForm(){
  ['elId','elPid','elType'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('elP').value=0;document.getElementById('elBase').value=0;
  document.getElementById('elWells').value=0;document.getElementById('elStart').valueAsDate=new Date();
}
['lineModal','logModal'].forEach(id=>{
  document.getElementById(id).addEventListener('click',e=>{
    if(e.target===document.getElementById(id)) document.getElementById(id).classList.remove('open');
  });
});

// ══════════════════════════════════════════
//  CSV EXPORT
//  Patient and Type as SEPARATE columns → no underscore/comma ambiguity
//  (still backward compatible: also writes combined Patient_Type quoted)
// ══════════════════════════════════════════
function exportCSV(){
  let csv='\uFEFFDate,Patient,Type,Action,P,D,Details,Final Wells,Stocks,Memo\n';
  logs.sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(lg=>{
    const line=lines.find(l=>l.id===lg.lineId);
    const pid =line?line.patientId:'Unknown';
    const typ =line?line.type:'';
    const q=s=>`"${String(s||'').replace(/"/g,'""')}"`;
    csv+=`${lg.date},${q(pid)},${q(typ)},${q(lg.action)},P${lg.passage},${lg.dayInfo||''},${q(lg.details)},${lg.finalWells||''},${lg.stocks||''},${q(lg.memo)}\n`;
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download=`Organoid_Log_${today()}.csv`;a.click();
}

// ══════════════════════════════════════════
//  CSV IMPORT  — robust, handles 3 formats:
//   (A) new: Date,Patient,Type,Action,...        (separate columns)
//   (B) old: Date,Patient_Type,Action,P,D,Vessel,Details,...
//   (C) old: Date,Patient_Type,Action,P,D,Details,...   (no vessel)
//  Also repairs broken rows where Patient_Type had a comma
//  (e.g. "HCC26 (2nd, Big)_PHH-org" split across 2 fields)
// ══════════════════════════════════════════
function parseCSVRow(str){
  const res=[];let cur='';let inQ=false;
  for(let i=0;i<str.length;i++){
    const c=str[i];
    if(inQ){if(c==='"'){if(str[i+1]==='"'){cur+='"';i++;}else inQ=false;}else cur+=c;}
    else{if(c==='"')inQ=true;else if(c===','){res.push(cur);cur='';}else cur+=c;}
  }
  res.push(cur);return res;
}

// Split "HCC26 (2nd, Big)_PHH-org" into patient + type
// Rule: split on the LAST underscore that is OUTSIDE any parentheses
function splitPatientType(raw){
  let depth=0, splitAt=-1;
  for(let i=0;i<raw.length;i++){
    const ch=raw[i];
    if(ch==='(') depth++;
    else if(ch===')') depth=Math.max(0,depth-1);
    else if(ch==='_'&&depth===0) splitAt=i; // remember last top-level underscore
  }
  if(splitAt<0){
    // fallback: last underscore anywhere
    splitAt=raw.lastIndexOf('_');
  }
  if(splitAt<0) return null;
  return {pid:raw.substring(0,splitAt).trim(), type:raw.substring(splitAt+1).trim()};
}

const KNOWN_ACTIONS=['Media Change','Split','Reseeding','Pellet 제작','Stock 제작','Observation','Seeded','Initial Seeding','Finish (완료)','Finish'];

function importCSV(event){
  const file=event.target.files[0];if(!file) return;
  if(lines.length||logs.length){
    if(!confirm('CSV 복원은 기존 데이터를 모두 지우고 새로 불러옵니다.\n(같은 파일을 여러 번 복원해도 중복되지 않습니다.)\n계속할까요?')){
      document.getElementById('csvFile').value='';return;
    }
  }
  const reader=new FileReader();
  reader.onload=e=>{
    let txt=e.target.result;
    if(txt.charCodeAt(0)===0xFEFF) txt=txt.substr(1);
    const rows=txt.split(/\r?\n/).filter(r=>r.trim());
    if(!rows.length){alert('빈 파일입니다.');return;}

    const hdr=parseCSVRow(rows[0]).map(h=>h.trim().toLowerCase());
    const hasSeparate = hdr.includes('patient') && hdr.includes('type');
    const hasVessel   = hdr.includes('vessel');
    const idxOf=name=>hdr.indexOf(name);
    let CI;
    if(hasSeparate){
      CI={date:idxOf('date'),patient:idxOf('patient'),type:idxOf('type'),
          action:idxOf('action'),p:idxOf('p'),d:idxOf('d'),
          details:idxOf('details'),wells:hdr.indexOf('final wells')>=0?hdr.indexOf('final wells'):idxOf('wells'),
          stocks:idxOf('stocks'),memo:idxOf('memo')};
    } else {
      CI={date:0,pt:1,action:2,p:3,d:4,
          vessel:hasVessel?5:-1,details:hasVessel?6:5,
          wells:hasVessel?7:6,stocks:hasVessel?8:7,memo:hasVessel?9:8};
    }

    // ── Step 1: parse every row into a normalized record ──
    const recs=[];
    for(let i=1;i<rows.length;i++){
      let r=parseCSVRow(rows[i]);
      if(r.length<4) continue;
      let dateVal,pId,type,action,pRaw,dRaw,details,wells,stocks,memo;

      if(hasSeparate){
        dateVal=(r[CI.date]||'').trim();
        pId    =(r[CI.patient]||'').trim();
        type   =(r[CI.type]||'').trim();
        action =(r[CI.action]||'').trim();
        pRaw   =(r[CI.p]||'').trim();
        dRaw   =(r[CI.d]||'').trim();
        details=(r[CI.details]||'').trim();
        wells  =(r[CI.wells]||'').trim();
        stocks =(r[CI.stocks]||'').trim();
        memo   =(r[CI.memo]||'').trim();
      } else {
        // repair rows where an unquoted comma split Patient_Type
        let ptEnd=CI.pt;
        while(ptEnd+1<r.length && !KNOWN_ACTIONS.includes((r[ptEnd+1]||'').trim())) ptEnd++;
        const ptRaw=r.slice(CI.pt,ptEnd+1).join(',').trim();
        const shift=ptEnd-CI.pt;
        dateVal=(r[CI.date]||'').trim();
        action =(r[CI.action+shift]||'').trim();
        pRaw   =(r[CI.p+shift]||'').trim();
        dRaw   =(r[CI.d+shift]||'').trim();
        details=(r[CI.details+shift]||'').trim();
        wells  =(r[CI.wells+shift]||'').trim();
        stocks =(r[CI.stocks+shift]||'').trim();
        memo   =(r[CI.memo+shift]||'').trim();
        if(!ptRaw||ptRaw==='Unknown') continue;
        const sp=splitPatientType(ptRaw);
        if(!sp) continue;
        pId=sp.pid; type=sp.type;
      }
      if(!dateVal||!pId||!type) continue;
      if(details==='라인 등록') details='';
      recs.push({date:dateVal,pId,type,action,passage:parseP(pRaw),
        dayInfo:dRaw||'',details,wells,stocks,memo,_t:new Date(dateVal).getTime()});
    }

    // ── Step 2: sort by date (stable), then group into lines ──
    // Same patientId+type that appears AFTER a Finish starts a NEW line (re-culture).
    recs.sort((a,b)=>a._t-b._t);

    // FRESH import: wipe existing data
    lines=[]; logs=[]; stockChecks=[];

    // map key "pId||type" → current open line object (or null if closed)
    const openLine={};

    recs.forEach(rec=>{
      const key=rec.pId+'||'+rec.type;
      let line=openLine[key];

      // need a new line if none open
      if(!line){
        line={id:'imp_'+uid(),patientId:rec.pId,type:rec.type,
          passage:rec.passage,baseDay:0,isReseeded:false,
          startDate:isoD(rec.date),initialWells:rec.wells,isCompleted:false};
        lines.push(line);
        openLine[key]=line;
      }

      // dedupe within this line
      const dup=logs.find(l=>l.lineId===line.id&&l.date===rec.date&&l.action===rec.action&&l.passage===rec.passage&&l.dayInfo===rec.dayInfo);
      if(!dup){
        logs.push({id:uid(),lineId:line.id,date:rec.date,action:rec.action,
          passage:rec.passage,dayInfo:rec.dayInfo||'d0',
          details:rec.details,finalWells:rec.wells,stocks:rec.stocks,memo:rec.memo});
        // rebuild stock checks
        if(rec.action==='Stock 제작'&&rec.stocks&&parseInt(rec.stocks)>0){
          stockChecks.push({id:uid(),lineLabel:`${rec.pId}_${rec.type}`,date:rec.date,
            stocks:rec.stocks,ln2Done:false,dbDone:false});
        }
      }

      // if this row finishes the line → close it so future rows start fresh
      if(isFin(rec.action)){
        line.isCompleted=true;
        line.finishDate=rec.date;
        line.finishDayStr=(rec.dayInfo&&rec.dayInfo!=='END')?rec.dayInfo:'END';
        openLine[key]=null;
      }
    });

    // ── Step 3: set each line's CURRENT passage / day from its latest non-finish log ──

    ensureSeedLogs(true);
    updateUI();
    alert(`CSV 복원 완료. 라인 ${lines.length}개, 기록 ${logs.length}개를 불러왔습니다.`);
    document.getElementById('csvFile').value='';
  };
  reader.readAsText(file);
}

// ══════════════════════════════════════════
//  CLEAN BROKEN LINES
//  Removes lines whose type looks broken (starts with "(" / empty)
//  and logs whose action looks like a stray patient-type fragment
//  e.g. type="2nd" from "HCC26 (2nd" , or action="Big)_PHH-org"
// ══════════════════════════════════════════
function cleanBroken(){
  const KNOWN=['Media Change','Split','Reseeding','Pellet 제작','Stock 제작','Observation','Seeded','Initial Seeding','Finish (완료)','Finish'];
  const isBrokenLine=l=>{
    if(!l.type) return true;
    // type contains ")" or "(" → leftover fragment
    if(/[()]/.test(l.type)) return true;
    // patientId ends with "(" with no closing → "HCC26 (2nd"
    const opens=(l.patientId.match(/\(/g)||[]).length;
    const closes=(l.patientId.match(/\)/g)||[]).length;
    if(opens!==closes) return true;
    return false;
  };
  const broken=lines.filter(isBrokenLine);
  // also detect logs whose action isn't a known action (stray fragment)
  const strayLogs=logs.filter(lg=>{
    const a=(lg.action||'').trim();
    return a && !KNOWN.some(k=>a===k||a.includes(k));
  });

  if(!broken.length && !strayLogs.length){
    alert('정리할 깨진 라인이 없습니다.');return;
  }
  const names=broken.map(l=>`${l.patientId}_${l.type}`).join(', ');
  if(!confirm(`깨진 라인 ${broken.length}개${names?' ('+names+')':''}와 비정상 로그 ${strayLogs.length}개를 삭제합니다.\n\n삭제 후 원본 CSV를 다시 [CSV 복원] 하면 정상 복구됩니다. 계속할까요?`)) return;

  const brokenIds=new Set(broken.map(l=>l.id));
  lines=lines.filter(l=>!brokenIds.has(l.id));
  logs=logs.filter(lg=>!brokenIds.has(lg.lineId));
  const strayIds=new Set(strayLogs.map(l=>l.id));
  logs=logs.filter(lg=>!strayIds.has(lg.id));
  updateUI();
  alert('정리 완료. 이제 원본 CSV를 다시 복원하세요.');
}

// ══════════════════════════════════════════
//  ENSURE SEED LOGS — dedup + normalize
//  skipCreate=true → only dedup/normalize, don't auto-add Seeded
//  (used after CSV import, where the CSV already holds first records)
// ══════════════════════════════════════════
function ensureSeedLogs(skipCreate){
  lines.forEach(line=>{
    logs.forEach(lg=>{ if(lg.lineId===line.id&&lg.action==='Initial Seeding') lg.action='Seeded'; });
    const seedLogs=logs.filter(l=>l.lineId===line.id&&l.action==='Seeded')
      .sort((a,b)=>new Date(a.date)-new Date(b.date));
    if(seedLogs.length>1){
      const keep=seedLogs[0].id;
      logs=logs.filter(l=>!(l.lineId===line.id&&l.action==='Seeded'&&l.id!==keep));
    }
function ensureSeedLogs(skipCreate){
  lines.forEach(line=>{
    logs.forEach(lg=>{
      if(lg.lineId===line.id&&lg.action==='Initial Seeding')
        lg.action='Seeded';
    });

    const seedLogs=logs
      .filter(l=>l.lineId===line.id&&l.action==='Seeded')
      .sort((a,b)=>new Date(a.date)-new Date(b.date));

    if(seedLogs.length>1){
      const keep=seedLogs[0].id;

      logs=logs.filter(l=>
        !(l.lineId===line.id &&
          l.action==='Seeded' &&
          l.id!==keep)
      );
    }
  });
}
// ══════════════════════════════════════════
//  BOOT — fix legacy data
// ══════════════════════════════════════════
logs.forEach(lg=>{
  if(typeof lg.passage==='string') lg.passage=parseP(lg.passage);
  if(lg.passage===null||lg.passage===undefined){
    const line=lines.find(l=>l.id===lg.lineId);
    lg.passage=line?parseP(line.passage):0;
  }
  if(lg.action==='Initial Seeding') lg.action='Seeded';
  if(lg.details==='라인 등록') lg.details='';
});
lines.forEach(line=>{
  if(typeof line.passage==='string') line.passage=parseP(line.passage);
  if(!line.passage&&line.passage!==0) line.passage=0;
  if(line.isCompleted&&!line.finishDate){
    const fl=logs.filter(l=>l.lineId===line.id&&isFin(l.action)).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
    if(fl){line.finishDate=fl.date;line.finishDayStr=fl.dayInfo||'END';}
  }
});

ensureSeedLogs(true);
updateUI();
</script>

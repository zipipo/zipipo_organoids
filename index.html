<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organoid OS v2.6</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            --bg: #F8FAFC; --surface: #FFFFFF; --primary: #3B82F6; --primary-soft: #EFF6FF;
            --text-main: #1E293B; --text-sub: #64748B; --border: #E2E8F0;
            --phh-bg: #E0F2FE; --phh-text: #0369A1;
            --tumor-bg: #FFEDD5; --tumor-text: #9A3412;
            --chol-bg: #F3E8FF; --chol-text: #6B21A8;
            --completed-bg: #F1F5F9; --completed-text: #475569;
        }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding: 15px; line-height: 1.3; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        h1 { font-size: 1.3rem; font-weight: 700; margin: 0; color: #0F172A; }
        
        .btn { font-family: inherit; font-weight: 600; cursor: pointer; border-radius: 4px; padding: 0 12px; border: none; transition: 0.1s; font-size: 0.8rem; height: 32px; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: white; border: 1px solid var(--border); color: var(--text-sub); }
        .btn-edit { background: #F1F5F9; color: #475569; border: 1px solid var(--border); }
        .btn-complete { background: #D1FAE5; color: #065F46; }
        .btn-delete { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; }
        .btn-quick { background: #3B82F6; color: white; font-size: 0.75rem; height: 24px; padding: 0 8px; }
        .btn:hover { opacity: 0.8; }

        .card { background: var(--surface); border-radius: 6px; border: 1px solid var(--border); margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
        .card-header { padding: 10px 12px; border-bottom: 1px solid var(--border); font-weight: 700; background: #F8FAFC; font-size: 0.9rem; }

        /* 📋 개편된 텍스트 대시보드 스타일 */
        .dashboard-box { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 12px; display: flex; gap: 20px; align-items: start; }
        .dash-summary { min-width: 150px; border-right: 1px solid var(--border); padding-right: 20px; }
        .dash-summary .lbl { font-size: 0.75rem; color: var(--text-sub); font-weight: 600; }
        .dash-summary .val { font-size: 1.8rem; font-weight: 800; color: var(--primary); margin-top: 4px; }
        .dash-status-list { flex: 1; }
        .dash-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; text-align: left; }
        .dash-table th { color: var(--text-sub); padding: 4px 6px; font-weight: 600; border-bottom: 1px solid var(--border); background: #F8FAFC; }
        .dash-table td { padding: 6px; border-bottom: 1px solid #F1F5F9; }

        .entry-form { padding: 12px; background: var(--primary-soft); display: flex; flex-direction: column; gap: 10px; }
        .form-row { display: grid; gap: 10px; align-items: start; }
        .row-1 { grid-template-columns: 1.5fr 1.5fr 1fr 1fr; }
        .row-2 { grid-template-columns: 1.5fr 0.8fr 0.8fr 2fr 70px; }
        
        label { display: block; font-size: 0.75rem; color: #475569; margin-bottom: 4px; font-weight: 600; }
        input, select { width: 100%; height: 32px; padding: 0 8px; border: 1px solid #CBD5E1; border-radius: 4px; font-family: inherit; font-size: 0.85rem; box-sizing: border-box; }
        textarea { width: 100%; padding: 6px 8px; border: 1px solid #CBD5E1; border-radius: 4px; font-family: inherit; font-size: 0.85rem; box-sizing: border-box; resize: vertical; min-height: 32px; }
        
        .date-input-group { display: flex; gap: 6px; align-items: center; }
        .date-input-group input { flex: 1; }
        .date-input-group .btn { flex-shrink: 0; }

        .timeline-section { margin-bottom: 15px; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
        .timeline-header { padding: 8px 12px; font-weight: 700; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.05); }
        
        .type-phh { background-color: var(--phh-bg); color: var(--phh-text); }
        .type-tumor { background-color: var(--tumor-bg); color: var(--tumor-text); }
        .type-chol { background-color: var(--chol-bg); color: var(--chol-text); }
        .type-custom { background-color: #F1F5F9; color: #334155; border: 1px solid #CBD5E1; }
        .type-completed { background-color: var(--completed-bg); color: var(--completed-text); }

        table { width: 100%; border-collapse: collapse; text-align: left; background: white; table-layout: fixed; }
        th { padding: 8px; background: #F8FAFC; color: var(--text-sub); font-size: 0.75rem; border-bottom: 1px solid var(--border); }
        td { padding: 8px; border-bottom: 1px solid var(--border); font-size: 0.8rem; vertical-align: middle; word-wrap: break-word; }
        .td-memo { white-space: pre-wrap; word-break: break-all; }
        
        .badge { padding: 3px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; display: inline-block; white-space: nowrap; }
        .badge-media { background: #E0F2FE; color: #0284C7; border: 1px solid #BAE6FD; }
        .badge-split { background: #FFEDD5; color: #C2410C; border: 1px solid #FED7AA; }
        .badge-reseed { background: #D1FAE5; color: #059669; border: 1px solid #A7F3D0; }
        .badge-pellet { background: #F3E8FF; color: #7E22CE; border: 1px solid #E9D5FF; }
        .badge-stock { background: #FCE7F3; color: #BE185D; border: 1px solid #FBCFE8; }
        .badge-finish { background: #F1F5F9; color: #475569; border: 1px solid #CBD5E1; }
        .badge-obs { background: #FEF9C3; color: #A16207; border: 1px solid #FEF08A; }

        .p-badge { padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: 0.8rem; display: inline-block; border: 1px solid transparent; }
        .p-color-0 { background: #F1F5F9; color: #475569; border-color: #E2E8F0; } 
        .p-color-1 { background: #E0F2FE; color: #0284C7; border-color: #BAE6FD; } 
        .p-color-2 { background: #D1FAE5; color: #059669; border-color: #A7F3D0; } 
        .p-color-3 { background: #FEF3C7; color: #D97706; border-color: #FDE68A; } 
        .p-color-4 { background: #EDE9FE; color: #7C3AED; border-color: #DDD6FE; } 
        .p-color-5 { background: #FCE7F3; color: #DB2777; border-color: #FBCFE8; } 
        .p-color-6 { background: #E0E7FF; color: #4F46E5; border-color: #C7D2FE; } 
        .p-color-7 { background: #CCFBF1; color: #0D9488; border-color: #99F6E4; } 
        .p-color-8 { background: #FEE2E2; color: #DC2626; border-color: #FECACA; } 
        .p-color-9 { background: #FFEDD5; color: #EA580C; border-color: #FED7AA; } 
        .p-color-max { background: #1E293B; color: #F8FAFC; border-color: #0F172A; } 

        .action-edit-btn { background: #F8FAFC; border: 1px solid #E2E8F0; color: #475569; border-radius: 4px; cursor: pointer; font-size: 0.75rem; padding: 4px 8px; font-weight: 600; transition: 0.1s; }
        .action-edit-btn:hover { background: #E2E8F0; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; padding: 20px; border-radius: 6px; width: 550px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .modal-scroll-area { overflow-y: auto; flex: 1; padding-right: 5px; }
        .modal-footer { margin-top: 15px; border-top: 1px solid #E2E8F0; padding-top: 15px; }
        
        #bulkDateTags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
        .date-tag { background: #E2E8F0; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; display: flex; align-items: center; gap: 6px; font-weight: 500; }
        .date-tag span { cursor: pointer; font-weight: bold; color: #64748B; }
        .date-tag span:hover { color: #DC2626; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Organoid OS v2.6</h1>
            <div style="display:flex; gap:8px;">
                <input type="file" id="csvFileInput" style="display:none;" accept=".csv" onchange="importCSV(event)">
                <button class="btn btn-outline" onclick="document.getElementById('csvFileInput').click()">[업로드] CSV 복원</button>
                <button class="btn btn-outline" onclick="openLineModal()">마스터 라인 관리</button>
                <button class="btn btn-outline" onclick="exportToCSV()">[다운로드] CSV 저장</button>
            </div>
        </div>

        <div class="dashboard-box">
            <div class="dash-summary">
                <div class="lbl">🧪 배양 중인 라인</div>
                <div class="val" id="dashTotalLines">0</div>
            </div>
            <div class="dash-status-list">
                <table class="dash-table">
                    <thead>
                        <tr>
                            <th>라인명</th>
                            <th style="text-align:center;">현재 규모 (Well)</th>
                            <th>마지막 주요 작업</th>
                            <th style="text-align:center;">작업 경과일</th>
                            <th style="text-align:center;">권장 상태</th>
                        </tr>
                    </thead>
                    <tbody id="dashLinesStatusArea">
                        </tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <div class="card-header">데일리 작업 기록</div>
            <div class="entry-form">
                <div class="form-row row-1">
                    <div>
                        <label>작업 날짜</label>
                        <div class="date-input-group">
                            <input type="date" id="logDate">
                            <button class="btn btn-outline" onclick="addBulkDate()">날짜 다중추가</button>
                        </div>
                        <div id="bulkDateTags"></div>
                    </div>
                    <div><label>라인 선택</label><select id="lineSelect" onchange="previewDay()"></select></div>
                    <div><label>수행 액션</label>
                        <select id="logAction">
                            <option value="Media Change">Media Change</option>
                            <option value="Split">Split</option>
                            <option value="Reseeding">Reseeding</option>
                            <option value="Pellet 제작">Pellet 제작</option>
                            <option value="Stock 제작">Stock 제작</option>
                            <option value="Observation">Observation</option>
                        </select>
                    </div>
                    <div><label>Vessel (Seeding)</label>
                        <select id="logVessel">
                            <option value="-">-</option>
                            <option value="100pi dish">100pi dish</option>
                            <option value="6 well plate">6 well plate</option>
                            <option value="24 well plate">24 well plate</option>
                            <option value="48 well plate">48 well plate</option>
                            <option value="96 well plate">96 well plate</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                </div>
                <div class="form-row row-2">
                    <div><label>과정/Ratio</label><input type="text" id="logDetails" placeholder="1:4 등"></div>
                    <div><label>최종 Well 수</label><input type="number" id="logFinalWells" min="0"></div>
                    <div><label style="color:#A16207">Stock 수 (필요시 기록)</label><input type="number" id="logStocks" min="0"></div>
                    <div><label>메모 (Enter 구분 가능)</label><textarea id="logMemo" rows="1" placeholder="특이사항"></textarea></div>
                    <button class="btn btn-primary" style="align-self:end; height:32px;" onclick="saveDailyLog()">기록</button>
                </div>
            </div>
            <div id="previewArea" style="padding: 8px 12px; font-size: 0.85rem; color: var(--primary); font-weight: 600; background: #fff; border-bottom: 1px solid #E2E8F0;"></div>
        </div>

        <h2 style="font-size: 1rem; margin: 20px 0 10px;">진행 중인 배양 타임라인</h2>
        <div id="activeTimelineContainer"></div>

        <h2 style="font-size: 1rem; margin: 30px 0 10px; color: var(--text-sub);">완료된 기록 (Archive)</h2>
        <div id="completedTimelineContainer"></div>
    </div>

    <div id="lineModal" class="modal">
        <div class="modal-content">
            <h2 style="margin:0 0 15px; font-size:1.1rem; border-bottom:1px solid #E2E8F0; padding-bottom:10px;">라인 등록 및 관리</h2>
            <div class="modal-scroll-area">
                <div style="background: #F8FAFC; padding: 15px; border-radius: 6px; border: 1px solid #E2E8F0; margin-bottom: 15px;">
                    <input type="hidden" id="editLineId">
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
                        <div><label>환자 번호</label><input type="text" id="newLineId"></div>
                        <div><label>종류 (신규 자동 축적)</label>
                            <input type="text" id="newLineType" list="organoidTypes" placeholder="직접입력 또는 선택">
                            <datalist id="organoidTypes">
                                </datalist>
                        </div>
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin-bottom:10px;">
                        <div><label>초기 P</label><input type="number" id="newLineP" value="0"></div>
                        <div><label>초기 d (누적)</label><input type="number" id="newLineBaseD" value="0"></div>
                        <div><label>초기 Well 수</label><input type="number" id="newLineWells" value="0"></div>
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <div><label style="color:#D97706">초기 기준 날짜 (Seeding일)</label><input type="date" id="newLineStartDate"></div>
                        <div><label>초기 Vessel</label>
                            <select id="newLineVessel">
                                <option value="100pi dish">100pi dish</option>
                                <option value="6 well plate">6 well plate</option>
                                <option value="24 well plate">24 well plate</option>
                                <option value="48 well plate">48 well plate</option>
                                <option value="96 well plate">96 well plate</option>
                                <option value="-">-</option>
                            </select>
                        </div>
                    </div>
                    <div style="display:flex; gap:10px; margin-top:15px;">
                        <button class="btn btn-primary" style="flex:1;" onclick="saveLine()">라인 저장/수정</button>
                        <button class="btn btn-outline" onclick="resetLineForm()">입력창 초기화</button>
                    </div>
                </div>
                
                <h3 style="font-size:0.9rem; margin:15px 0 10px; color:#1E293B;">배양 중인 라인</h3>
                <div id="activeLinesList"></div>
                
                <h3 style="font-size:0.9rem; margin:20px 0 10px; color:#64748B;">완료된 라인</h3>
                <div id="completedLinesList"></div>
            </div>
            
            <div class="modal-footer">
                <button class="btn btn-outline" style="width:100%;" onclick="closeModal()">닫기</button>
            </div>
        </div>
    </div>

    <div id="logEditModal" class="modal">
        <div class="modal-content" style="width: 600px;">
            <h2 style="margin:0 0 15px; font-size:1.1rem; border-bottom:1px solid #E2E8F0; padding-bottom:10px;">기록 상세 수정</h2>
            <div class="modal-scroll-area">
                <input type="hidden" id="editLogId">
                <div style="display:grid; gap:12px; background: #F8FAFC; padding: 15px; border-radius: 6px; border: 1px solid #E2E8F0;">
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <div><label>작업 날짜</label><input type="date" id="editLogDate"></div>
                        <div><label style="color:#0284C7;">수행 액션</label>
                            <select id="editLogAction">
                                <option value="Media Change">Media Change</option>
                                <option value="Split">Split</option>
                                <option value="Reseeding">Reseeding</option>
                                <option value="Pellet 제작">Pellet 제작</option>
                                <option value="Stock 제작">Stock 제작</option>
                                <option value="Observation">Observation</option>
                                <option value="Finish (완료)">Finish (완료)</option>
                                <option value="Initial Seeding">Initial Seeding</option>
                            </select>
                        </div>
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <div><label>과정/Ratio</label><input type="text" id="editLogDetails"></div>
                        <div><label>Vessel</label>
                            <select id="editLogVessel">
                                <option value="-">-</option>
                                <option value="100pi dish">100pi dish</option>
                                <option value="6 well plate">6 well plate</option>
                                <option value="24 well plate">24 well plate</option>
                                <option value="48 well plate">48 well plate</option>
                                <option value="96 well plate">96 well plate</option>
                                <option value="기타">기타</option>
                            </select>
                        </div>
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <div><label>최종 Well 수</label><input type="number" id="editLogFinalWells"></div>
                        <div><label>Stock 수</label><input type="number" id="editLogStocks"></div>
                    </div>
                    <div><label>메모</label><textarea id="editLogMemo" rows="3"></textarea></div>
                    <div style="font-size:0.75rem; color:#64748B; background:#F1F5F9; padding:8px; border-radius:4px;">
                        💡 <b>안내:</b> 액션(Split/Reseeding)이나 날짜를 수정하면, 이후 모든 로그의 P와 D-day가 <b>자동으로 재계산</b>됩니다.
                    </div>
                </div>
            </div>
            <div class="modal-footer" style="display:flex; gap:10px;">
                <button class="btn btn-primary" style="flex:2;" onclick="updateLog()">수정 완료 (자동 재계산)</button>
                <button class="btn btn-delete" style="flex:1;" onclick="deleteLogFromModal()">삭제</button>
                <button class="btn btn-outline" style="flex:1;" onclick="closeLogEditModal()">취소</button>
            </div>
        </div>
    </div>

<script>
    let lines = JSON.parse(localStorage.getItem('orgLinesV2')) || [];
    let logs = JSON.parse(localStorage.getItem('orgLogsV2')) || [];
    // 🔄 종류 자동완성 기억 저장소
    let orgTypes = JSON.parse(localStorage.getItem('orgTypesV2')) || ['PHH-org', 'Tumor-org', 'Chol-org'];
    let bulkDates = [];

    document.getElementById('logDate').valueAsDate = new Date();
    document.getElementById('newLineStartDate').valueAsDate = new Date();

    function calcDDay(line, targetDate = new Date()) {
        let tDate = new Date(targetDate);
        if (line.isCompleted) {
            const finishLog = logs.find(l => l.lineId === line.id && l.action.includes('Finish'));
            if (finishLog) tDate = new Date(finishLog.date);
        }
        const start = new Date(line.startDate);
        start.setHours(0,0,0,0); tDate.setHours(0,0,0,0);
        let diff = Math.floor((tDate - start) / (1000 * 60 * 60 * 24));
        if (diff < 0) diff = 0;
        return line.baseDay > 0 || line.isReseeded ? `d${line.baseDay}+${diff}` : `d${diff}`;
    }

    function getBannerClass(type, isCompleted) {
        if (isCompleted) return 'type-completed';
        if (type === 'PHH-org') return 'type-phh';
        if (type === 'Tumor-org') return 'type-tumor';
        if (type === 'Chol-org') return 'type-chol';
        return 'type-custom';
    }

    function getActionBadge(action) {
        if (!action) return 'badge-obs';
        if (action.includes('Media')) return 'badge-media';
        if (action.includes('Split') || action.includes('Seeding')) return 'badge-split';
        if (action.includes('Reseed')) return 'badge-reseed';
        if (action.includes('Pellet')) return 'badge-pellet';
        if (action.includes('Stock')) return 'badge-stock';
        if (action.includes('Finish') || action.includes('완료')) return 'badge-finish';
        return 'badge-obs';
    }

    function getPassageClass(pStr) {
        const pNum = parseInt(String(pStr).replace(/[^0-9]/g, '')) || 0;
        if(pNum >= 0 && pNum <= 9) return `p-color-${pNum}`;
        return 'p-color-max';
    }

    function recalculateLine(lineId) {
        const lineLogs = logs.filter(l => l.lineId === lineId).sort((a, b) => new Date(a.date) - new Date(b.date));
        if (lineLogs.length === 0) return;
        const line = lines.find(l => l.id === lineId);
        
        let currentP = line.initialPassage ?? parseInt(line.passage);
        let currentBaseDay = line.initialBaseDay ?? 0;
        let currentStartDate = new Date(line.initialStartDate || lineLogs[0].date);
        let isReseeded = line.initialIsReseeded ?? false;

        lineLogs.forEach(log => {
            if (log.action === 'Split') {
                currentP += 1; currentBaseDay = 0; currentStartDate = new Date(log.date); isReseeded = false;
            } else if (log.action === 'Reseeding') {
                let diff = Math.floor((new Date(log.date) - currentStartDate) / 86400000);
                if (diff < 0) diff = 0;
                currentBaseDay += diff; currentStartDate = new Date(log.date); isReseeded = true;
            }
            log.passage = currentP;
            let logDiff = Math.floor((new Date(log.date) - currentStartDate) / 86400000);
            if (logDiff < 0) logDiff = 0;
            log.dayInfo = (currentBaseDay > 0 || isReseeded) ? `d${currentBaseDay}+${logDiff}` : `d${logDiff}`;
        });

        line.passage = currentP;
        line.baseDay = currentBaseDay;
        line.startDate = currentStartDate.toISOString();
        line.isReseeded = isReseeded;
    }

    // 📋 개편된 스마트 텍스트 대시보드 엔진
    function updateDashboard() {
        const activeLines = lines.filter(l => !l.isCompleted);
        document.getElementById('dashTotalLines').innerText = activeLines.length;

        let html = '';
        if (activeLines.length === 0) {
            html = '<tr><td colspan="5" style="text-align:center; color:var(--text-sub); padding:15px;">현재 배양 중인 라인이 없습니다.</td></tr>';
            document.getElementById('dashLinesStatusArea').innerHTML = html;
            return;
        }

        activeLines.forEach(line => {
            // 마지막 미디어 체인지 또는 스플릿 날짜 추적
            const lineLogs = logs.filter(log => log.lineId === line.id && 
                ['Media Change', 'Split', 'Reseeding', 'Initial Seeding'].includes(log.action))
                .sort((a,b) => new Date(b.date) - new Date(a.date));
            
            let lastDateStr = line.initialStartDate ? line.initialStartDate.split('T')[0] : line.startDate.split('T')[0];
            let lastAction = "Initial Seeding";
            
            if (lineLogs.length > 0) {
                lastDateStr = lineLogs[0].date;
                lastAction = lineLogs[0].action;
            }

            const today = new Date();
            const lastDate = new Date(lastDateStr);
            today.setHours(0,0,0,0); lastDate.setHours(0,0,0,0);
            const diffDays = Math.floor((today - lastDate) / 86400000);

            // 실시간 최신 Well 규모 파악
            const allLogs = logs.filter(log => log.lineId === line.id).sort((a,b) => new Date(b.date) - new Date(a.date));
            let currentWell = (allLogs.length > 0 && allLogs[0].finalWells) ? allLogs[0].finalWells : (line.initialWells || '-');

            // ⚠️ 2~3일 주기 오버 여부 판단 조건식 규칙
            let statusBadge = '<span style="color:#059669; font-weight:600; background:#D1FAE5; padding:2px 6px; border-radius:4px;">정상</span>';
            if (diffDays >= 3) {
                statusBadge = '<span style="color:#DC2626; font-weight:600; background:#FEF2F2; padding:2px 6px; border-radius:4px;">⚠️ 미디어 교체 필요</span>';
            } else if (diffDays === 2) {
                statusBadge = '<span style="color:#D97706; font-weight:600; background:#FFFBEB; padding:2px 6px; border-radius:4px;">교체 준비기</span>';
            }

            html += `<tr>
                <td style="font-weight:700;">[${line.patientId}_${line.type}]</td>
                <td style="text-align:center; color:#059669; font-weight:700;">${currentWell} Well</td>
                <td style="color:var(--text-sub);">${lastAction} (${lastDateStr})</td>
                <td style="text-align:center; font-weight:700; color:${diffDays >= 3 ? '#DC2626' : 'var(--text-main)'};">${diffDays}일 경과</td>
                <td style="text-align:center;">${statusBadge}</td>
            </tr>`;
        });

        document.getElementById('dashLinesStatusArea').innerHTML = html;
    }

    // ⚡ 원클릭 미디어체인지 매직 퀵 버튼 엔진
    function quickMediaChange(lineId) {
        const line = lines.find(l => l.id === lineId);
        const todayStr = new Date().toISOString().split('T')[0];
        
        // 이전 로그에서 정보 상속(Vessel, Well 유실 방지)
        const lineLogs = logs.filter(log => log.lineId === lineId).sort((a,b) => new Date(b.date) - new Date(a.date));
        let prevVessel = "-";
        let prevWells = line.initialWells || "";
        
        if (lineLogs.length > 0) {
            prevVessel = lineLogs[0].vessel || "-";
            prevWells = lineLogs[0].finalWells || "";
        }
        
        const newLog = {
            id: Date.now() + Math.random().toString(),
            lineId, date: todayStr, action: 'Media Change', vessel: prevVessel,
            passage: line.passage, dayInfo: calcDDay(line, todayStr), details: '',
            finalWells: prevWells, stocks: '', memo: '⚡ 퀵 미디어 체인지 버튼 사용'
        };
        
        logs.push(newLog);
        recalculateLine(lineId);
        updateUI();
    }

    function renderTypeDatalist() {
        const dl = document.getElementById('organoidTypes');
        dl.innerHTML = orgTypes.map(t => `<option value="${t}"></option>`).join('');
    }

    function updateUI() {
        const select = document.getElementById('lineSelect');
        select.innerHTML = '<option value="">-- 라인 선택 --</option>';
        lines.filter(l => !l.isCompleted).forEach(l => {
            const opt = document.createElement('option');
            opt.value = l.id; opt.innerText = `${l.patientId}_${l.type} (P${l.passage})`;
            select.appendChild(opt);
        });

        renderTimelines('activeTimelineContainer', false);
        renderTimelines('completedTimelineContainer', true);
        renderLinesList();
        renderTypeDatalist();
        updateDashboard();

        localStorage.setItem('orgLinesV2', JSON.stringify(lines));
        localStorage.setItem('orgLogsV2', JSON.stringify(logs));
        localStorage.setItem('orgTypesV2', JSON.stringify(orgTypes));
    }

    function renderTimelines(containerId, filterCompleted) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        const filteredLines = lines.filter(l => !!l.isCompleted === filterCompleted);

        filteredLines.forEach(line => {
            const lineLogs = logs.filter(log => log.lineId === line.id).sort((a,b) => {
                if (a.date !== b.date) return new Date(b.date) - new Date(a.date);
                if (a.action.includes('Finish')) return -1;
                if (b.action.includes('Finish')) return 1;
                return 0;
            });
            
            const bannerClass = getBannerClass(line.type, line.isCompleted);
            
            let html = `
            <div class="timeline-section">
                <div class="timeline-header ${bannerClass}">
                    <span>[${line.patientId}_${line.type}] <span class="p-badge ${getPassageClass(line.passage)}">P${line.passage}</span> / ${calcDDay(line)}</span>
                    <div style="display:flex; gap:6px; align-items:center;">
                        ${!line.isCompleted ? `<button class="btn btn-quick" onclick="quickMediaChange('${line.id}')">⚡ 퀵 미디어 체인지</button>` : ''}
                        ${!line.isCompleted ? `<button class="btn btn-complete" onclick="completeLine('${line.id}')">배양 완료</button>` : ''}
                        <button class="btn btn-edit" onclick="editLine('${line.id}')">라인 수정</button>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr><th style="width:11%">Date</th><th style="width:14%">Action</th><th style="width:12%">P / D</th><th style="width:10%">Vessel</th><th style="width:8%">Ratio</th><th style="width:8%">Well</th><th style="width:8%">Stock</th><th style="width:23%">Memo</th><th style="width:6%; text-align:center;">Edit</th></tr>
                    </thead>
                    <tbody>`;
            
            lineLogs.forEach(log => {
                html += `<tr>
                    <td style="color:var(--text-sub)">${log.date}</td>
                    <td><span class="badge ${getActionBadge(log.action)}">${log.action}</span></td>
                    <td>
                        <span class="p-badge ${getPassageClass(log.passage)}">P${log.passage}</span>
                        <span style="color:var(--text-sub); font-size:0.8rem; margin-left:2px;">/ ${log.dayInfo}</span>
                    </td>
                    <td style="color:#475569; font-size:0.75rem;">${log.vessel && log.vessel !== '-' ? log.vessel : ''}</td>
                    <td>${log.details || '-'}</td>
                    <td style="color:#059669; font-weight:700">${log.finalWells || '-'}</td>
                    <td style="color:#BE185D; font-weight:700">${log.stocks ? log.stocks + ' vial' : '-'}</td>
                    <td class="td-memo">${log.memo || '-'}</td>
                    <td style="text-align:center;"><button class="action-edit-btn" onclick="openLogEditModal('${log.id}')">수정</button></td>
                </tr>`;
            });
            html += `</tbody></table></div>`;
            container.innerHTML += html;
        });
    }

    function renderLinesList() {
        const activeList = document.getElementById('activeLinesList');
        const completedList = document.getElementById('completedLinesList');
        activeList.innerHTML = ''; completedList.innerHTML = '';

        lines.forEach(l => {
            const html = `<div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #E2E8F0; align-items:center; background: ${l.isCompleted ? '#F8FAFC' : 'white'};">
                <span style="font-size:0.85rem; font-weight:500; color: ${l.isCompleted ? '#94A3B8' : '#1E293B'}">${l.patientId}_${l.type}</span>
                <div style="display:flex; gap:6px;">
                    <button class="btn btn-edit" onclick="editLine('${l.id}')">수정</button>
                    <button class="btn btn-delete" onclick="deleteLine('${l.id}')">삭제</button>
                </div>
            </div>`;
            
            if(l.isCompleted) completedList.innerHTML += html;
            else activeList.innerHTML += html;
        });
    }

    function addBulkDate() {
        const d = document.getElementById('logDate').value;
        if(d && !bulkDates.includes(d)) { bulkDates.push(d); renderBulkTags(); }
    }
    function removeBulkDate(d) {
        bulkDates = bulkDates.filter(date => date !== d); renderBulkTags();
    }
    function renderBulkTags() {
        const container = document.getElementById('bulkDateTags');
        container.innerHTML = bulkDates.map(d => `<span class="date-tag">${d} <span onclick="removeBulkDate('${d}')">✕</span></span>`).join('');
    }

    function saveDailyLog() {
        const lineId = document.getElementById('lineSelect').value;
        const action = document.getElementById('logAction').value;
        const vessel = document.getElementById('logVessel').value;
        const details = document.getElementById('logDetails').value;
        const wells = document.getElementById('logFinalWells').value;
        const stocks = document.getElementById('logStocks').value;
        const memo = document.getElementById('logMemo').value;
        
        let datesToProcess = bulkDates.length > 0 ? [...bulkDates] : [document.getElementById('logDate').value];
        if(!lineId || datesToProcess.length === 0) return alert("라인과 날짜를 확인하세요.");

        datesToProcess.sort().forEach(date => {
            const line = lines.find(l => l.id === lineId);
            const dInfo = calcDDay(line, date);
            
            const newLog = { 
                id: Date.now() + Math.random().toString(), 
                lineId, date, action, vessel, passage: line.passage, 
                dayInfo: dInfo, details, finalWells: wells, stocks, memo 
            };
            logs.push(newLog);
            recalculateLine(lineId);
        });

        bulkDates = []; renderBulkTags();
        document.getElementById('logDetails').value = '';
        document.getElementById('logFinalWells').value = '';
        document.getElementById('logStocks').value = '';
        document.getElementById('logMemo').value = '';
        updateUI(); previewDay();
    }

    function saveLine() {
        const id = document.getElementById('editLineId').value;
        const pId = document.getElementById('newLineId').value;
        const type = document.getElementById('newLineType').value.trim();
        const p = parseInt(document.getElementById('newLineP').value) || 0;
        const baseD = parseInt(document.getElementById('newLineBaseD').value) || 0;
        const wells = document.getElementById('newLineWells').value;
        const start = document.getElementById('newLineStartDate').value;
        const vessel = document.getElementById('newLineVessel').value;

        if(!pId || !start || !type) return alert("필수 정보(환자번호, 종류, 시작일)를 입력하세요.");

        // 🔄 새로운 종류(Type) 발견 시 로컬 기억 저장소에 축적
        if (!orgTypes.includes(type)) {
            orgTypes.push(type);
        }

        if(id) {
            const idx = lines.findIndex(l => l.id === id);
            lines[idx] = { ...lines[idx], patientId: pId, type };
            lines[idx].initialPassage = p;
            lines[idx].initialBaseDay = baseD;
            lines[idx].initialStartDate = new Date(start).toISOString();
            lines[idx].initialIsReseeded = (baseD > 0);
            recalculateLine(id);
        } else {
            const newId = Date.now().toString();
            lines.push({ 
                id: newId, patientId: pId, type, passage: p, baseDay: baseD, 
                isReseeded: (baseD > 0), startDate: new Date(start).toISOString(), 
                initialWells: wells, isCompleted: false,
                initialPassage: p, initialBaseDay: baseD, initialStartDate: new Date(start).toISOString(), initialIsReseeded: (baseD > 0)
            });
            
            logs.push({
                id: Date.now() + Math.random().toString(), lineId: newId,
                date: start, action: 'Initial Seeding', vessel: vessel, passage: p,
                dayInfo: baseD > 0 ? `d${baseD}+0` : 'd0', details: '라인 등록', finalWells: wells, stocks: '', memo: 'Master Line Initialized'
            });
            recalculateLine(newId);
        }
        resetLineForm(); updateUI();
    }

    function editLine(id) {
        const l = lines.find(line => line.id === id);
        document.getElementById('editLineId').value = l.id;
        document.getElementById('newLineId').value = l.patientId;
        document.getElementById('newLineType').value = l.type;
        document.getElementById('newLineP').value = l.initialPassage ?? l.passage;
        document.getElementById('newLineBaseD').value = l.initialBaseDay ?? l.baseDay;
        document.getElementById('newLineWells').value = l.initialWells || '';
        document.getElementById('newLineStartDate').value = (l.initialStartDate || l.startDate).split('T')[0];
        document.getElementById('newLineVessel').value = "-";
        openLineModal();
    }

    function completeLine(id) {
        const m = prompt("완료 처리하시겠습니까? 완료 메모를 남겨주세요:");
        if (m === null) return;
        const l = lines.find(line => line.id === id);
        l.isCompleted = true;
        logs.push({ id: Date.now().toString(), lineId: id, date: new Date().toISOString().split('T')[0], action: 'Finish (완료)', passage: l.passage, dayInfo: 'END', memo: m || "배양 종료" });
        updateUI();
    }

    function openLogEditModal(id) {
        const log = logs.find(lg => lg.id === id);
        document.getElementById('editLogId').value = id;
        document.getElementById('editLogDate').value = log.date;
        
        let actionSelect = document.getElementById('editLogAction');
        if(![...actionSelect.options].some(o => o.value === log.action)) {
            actionSelect.add(new Option(log.action, log.action));
        }
        actionSelect.value = log.action;

        let vesselSelect = document.getElementById('editLogVessel');
        if(log.vessel && ![...vesselSelect.options].some(o => o.value === log.vessel)) {
            vesselSelect.add(new Option(log.vessel, log.vessel));
        }
        vesselSelect.value = log.vessel || "-";

        document.getElementById('editLogDetails').value = log.details || "";
        document.getElementById('editLogFinalWells').value = log.finalWells || "";
        document.getElementById('editLogStocks').value = log.stocks || "";
        document.getElementById('editLogMemo').value = log.memo || "";
        
        document.getElementById('logEditModal').style.display = 'flex';
    }
    
    function updateLog() {
        const id = document.getElementById('editLogId').value;
        const idx = logs.findIndex(lg => lg.id === id);
        const lineId = logs[idx].lineId;
        
        logs[idx].date = document.getElementById('editLogDate').value;
        logs[idx].action = document.getElementById('editLogAction').value;
        logs[idx].vessel = document.getElementById('editLogVessel').value;
        logs[idx].details = document.getElementById('editLogDetails').value;
        logs[idx].finalWells = document.getElementById('editLogFinalWells').value;
        logs[idx].stocks = document.getElementById('editLogStocks').value;
        logs[idx].memo = document.getElementById('editLogMemo').value;
        
        recalculateLine(lineId);
        closeLogEditModal(); updateUI();
    }

    function deleteLogFromModal() {
        const id = document.getElementById('editLogId').value;
        const log = logs.find(lg => lg.id === id);
        const lineId = log.lineId;
        if(confirm("이 기록을 삭제하시겠습니까? (이후 기록들이 재계산됩니다)")) {
            logs = logs.filter(l => l.id !== id);
            recalculateLine(lineId);
            closeLogEditModal(); updateUI();
        }
    }

    function parseCSVRow(str) {
        const result = []; let curVal = ''; let inQuotes = false;
        for (let i = 0; i < str.length; i++) {
            const char = str[i];
            if (inQuotes) {
                if (char === '"') {
                    if (i + 1 < str.length && str[i + 1] === '"') { curVal += '"'; i++; } 
                    else { inQuotes = false; }
                } else { curVal += char; }
            } else {
                if (char === '"') { inQuotes = true; } 
                else if (char === ',') { result.push(curVal); curVal = ''; } 
                else { curVal += char; }
            }
        }
        result.push(curVal); return result;
    }

    function importCSV(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            let text = e.target.result;
            if (text.charCodeAt(0) === 0xFEFF) text = text.substr(1);
            const rows = text.split(/\r?\n/).filter(row => row.trim() !== '');
            
            const headerCount = parseCSVRow(rows[0]).length;
            const hasVesselCol = headerCount >= 10;
            let newLogsCount = 0;

            for(let i=1; i<rows.length; i++) {
                const row = parseCSVRow(rows[i]);
                if (row.length < 5) continue; 

                const dateVal = row[0];
                const patientType = row[1];
                const action = row[2];
                let pStr, dStr, vessel, details, finalWells, stocks, memo;

                if (hasVesselCol) {
                    pStr = row[3] || 'P0'; dStr = row[4] || 'd0'; vessel = row[5] || '-';
                    details = row[6] || ''; finalWells = row[7] || ''; stocks = row[8] || ''; memo = row[9] || '';
                } else {
                    pStr = row[3] || 'P0'; dStr = row[4] || 'd0'; vessel = '-';
                    details = row[5] || ''; finalWells = row[6] || ''; stocks = row[7] || ''; memo = row[8] || '';
                }

                if (!patientType || patientType === 'Unknown') continue;

                const [pId, ...typeArr] = patientType.split('_');
                const type = typeArr.join('_');

                let line = lines.find(l => l.patientId === pId && l.type === type && !l.isCompleted);
                if (!line) {
                    line = {
                        id: 'imported_' + Date.now() + Math.random(),
                        patientId: pId, type: type,
                        passage: parseInt(pStr.replace(/[^0-9]/g,'')) || 0,
                        baseDay: 0, isReseeded: dStr.includes('+'),
                        startDate: new Date(dateVal).toISOString(), 
                        initialWells: finalWells || 0, isCompleted: false
                    };
                    lines.push(line);
                }

                const exists = logs.find(l => l.lineId === line.id && l.date === dateVal && l.action === action && l.memo === memo);
                if (!exists) {
                    logs.push({
                        id: Date.now() + Math.random().toString(), lineId: line.id,
                        date: dateVal, action: action, vessel: vessel, passage: parseInt(pStr.replace(/[^0-9]/g,'')) || 0,
                        dayInfo: dStr, details: details, finalWells: finalWells, stocks: stocks, memo: memo
                    });
                    newLogsCount++;
                }
            }

            lines.forEach(line => recalculateLine(line.id));
            updateUI();
            alert(`✅ CSV 복원 완료! ${newLogsCount}개의 기록이 추가 및 동기화되었습니다.`);
            document.getElementById('csvFileInput').value = ''; 
        };
        reader.readAsText(file);
    }

    function exportToCSV() {
        let csv = "\uFEFFDate,Patient_Type,Action,P,D,Vessel,Details,Final Wells,Stocks,Memo\n";
        logs.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(l => {
            const line = lines.find(line => line.id === l.lineId);
            csv += `${l.date},${line ? line.patientId+'_'+line.type : 'Unknown'},${l.action},P${l.passage},${l.dayInfo},${l.vessel||'-'},"${l.details||''}",${l.finalWells||''},${l.stocks||''},"${(l.memo||'').replace(/"/g,'""')}"\n`;
        });
        const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Organoid_Log_Backup_v2.6.csv`; link.click();
    }

    function openLineModal() { document.getElementById('lineModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('lineModal').style.display = 'none'; resetLineForm(); }
    function closeLogEditModal() { document.getElementById('logEditModal').style.display = 'none'; }
    function resetLineForm() { document.getElementById('editLineId').value = ''; document.getElementById('newLineId').value = ''; document.getElementById('newLineType').value = ''; document.getElementById('newLineP').value = 0; document.getElementById('newLineBaseD').value = 0; document.getElementById('newLineWells').value = ''; document.getElementById('newLineVessel').value = '-'; }
    function deleteLine(id) { if(confirm("라인과 관련된 모든 로그가 삭제됩니다. 계속하시겠습니까?")) { lines = lines.filter(l => l.id !== id); logs = logs.filter(log => log.lineId !== id); updateUI(); } }
    function previewDay() {
        const lineId = document.getElementById('lineSelect').value;
        const preview = document.getElementById('previewArea');
        if(!lineId) { preview.innerText = '라인을 선택하면 P/D 상태가 미리 계산됩니다.'; return; }
        const line = lines.find(l => l.id === lineId);
        preview.innerText = `현재 상태: P${line.passage} / ${calcDDay(line, document.getElementById('logDate').value)}`;
    }

    document.getElementById('logDate').addEventListener('change', previewDay);
    updateUI();
</script>
</body>
